# Nginx 配置 — 客户管理后台
#
# 使用方式：
#   1. 将此文件复制到服务器 /etc/nginx/sites-available/crm
#   2. ln -s /etc/nginx/sites-available/crm /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;  # 替换为你的域名或 IP，如 crm.example.com

    # 前端静态文件根目录
    root /opt/crm/frontend/dist;
    index index.html;

    # Gzip 压缩，3M 带宽下效果显著（1.3MB → ~400KB）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # 静态资源（JS/CSS/图片）— 带哈希文件名，长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 请求转发给 Uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退 — 所有非 /api 路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
